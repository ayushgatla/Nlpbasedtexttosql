services:
  neurosql:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurosql-studio
    ports:
      - "8501:8501"
    volumes:
      # Persist user-created custom SQLite databases across container restarts
      - ./data/custom_dbs:/app/data/custom_dbs
      # Mount model weights directly from host (optional live reload without rebuilding)
      - ./best_model_v2_relational:/app/best_model_v2_relational:ro
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
